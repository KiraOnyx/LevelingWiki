name: levelingwiki
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - upload_data:/var/www/storage
    environment:
      OWNER_LOGIN_PATH: ${OWNER_LOGIN_PATH:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-xxxx}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:8080/auth/discord/callback}
      DISCORD_ROLE_TTL: ${DISCORD_ROLE_TTL:-300}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-0}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      UPLOAD_DIRECTORY: /var/www/storage/uploads
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Renseigner DB_DATABASE dans .env}
      DB_USERNAME: ${DB_USERNAME:?Renseigner DB_USERNAME dans .env}
      DB_PASSWORD: ${DB_PASSWORD:?Renseigner DB_PASSWORD dans .env}
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Renseigner DB_DATABASE dans .env}
      MARIADB_USER: ${DB_USERNAME:?Renseigner DB_USERNAME dans .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Renseigner DB_PASSWORD dans .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Renseigner DB_ROOT_PASSWORD dans .env}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  database_data:
  upload_data:
