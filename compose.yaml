name: levelingwiki
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Renseigner DB_DATABASE dans .env}
      DB_USERNAME: ${DB_USERNAME:?Renseigner DB_USERNAME dans .env}
      DB_PASSWORD: ${DB_PASSWORD:?Renseigner DB_PASSWORD dans .env}
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Renseigner DB_DATABASE dans .env}
      MARIADB_USER: ${DB_USERNAME:?Renseigner DB_USERNAME dans .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Renseigner DB_PASSWORD dans .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Renseigner DB_ROOT_PASSWORD dans .env}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  database_data:
