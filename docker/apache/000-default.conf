ServerName localhost
<VirtualHost *:80>
    RewriteEngine On
    RewriteRule ^/assets/images/.+\.(png|jpe?g|webp|avif)$ /index.php [PT,L,NC]
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
        AddType text/javascript .mjs
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogFormat "%h %l %u %t \"%m %H\" %>s %b" private_access
    CustomLog ${APACHE_LOG_DIR}/access.log private_access
</VirtualHost>
