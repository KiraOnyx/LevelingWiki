# Environnement jetable, indépendant de levelingwiki ; aucun volume de production.
name: levelingwiki-tests
services:
  web:
    build: ..
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ..:/var/www/html:ro
    environment:
      APP_ENV: test
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: levelingwiki_test
      DB_USERNAME: levelingwiki_test
      DB_PASSWORD: ${DB_PASSWORD:?Renseigner .env}
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: levelingwiki_test
      MARIADB_USER: levelingwiki_test
      MARIADB_PASSWORD: ${DB_PASSWORD:?Renseigner .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Renseigner .env}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
