# Environnement jetable, indépendant de levelingwiki ; aucun volume de production.
name: levelingwiki-tests
services:
  web:
    build: ..
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ..:/var/www/html:ro
    tmpfs:
      - /var/www/storage:uid=33,gid=33,mode=0700
    environment:
      OWNER_LOGIN_PATH: ${TEST_OWNER_LOGIN_PATH:-/isolated-test/0123456789abcdef0123456789abcdef}
      DISCORD_CLIENT_ID: '300000000000000001'
      DISCORD_CLIENT_SECRET: isolated-test-only
      DISCORD_GUILD_ID: '400000000000000001'
      DISCORD_REDIRECT_URI: http://localhost:8081/auth/discord/callback
      DISCORD_TEST_API: http://discord:8082
      SESSION_IDLE_SECONDS: ${TEST_SESSION_IDLE:-10}
      SESSION_ABSOLUTE_SECONDS: ${TEST_SESSION_ABSOLUTE:-120}
      UPLOAD_DIRECTORY: /var/www/storage/uploads
      APP_ENV: test
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: levelingwiki_test
      DB_USERNAME: levelingwiki_test
      DB_PASSWORD: isolated-test-password
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: levelingwiki_test
      MARIADB_USER: levelingwiki_test
      MARIADB_PASSWORD: isolated-test-password
      MARIADB_ROOT_PASSWORD: isolated-test-root-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  discord:
    image: levelingwiki-tests-web
    command: ["php", "-S", "0.0.0.0:8082", "/var/www/html/tests/discord-mock.php"]
    volumes:
      - ..:/var/www/html:ro
    environment:
      APP_ENV: test
      DB_DATABASE: levelingwiki_test
    tmpfs:
      - /tmp
